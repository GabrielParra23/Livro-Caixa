<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Livro-Caixa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
 
<!-- TELA DE LOGIN -->
<div class="auth-screen" id="authScreen">
  <h2>Livro-Caixa</h2>
  <p class="sub">Entre com seu e-mail para acessar seus lançamentos.</p>
  <div class="auth-tabs">
    <button type="button" id="tabLogin" class="active">Entrar</button>
    <button type="button" id="tabSignup">Criar conta</button>
  </div>
  <form id="authForm" novalidate>
    <div class="field"><label for="authEmail">E-mail</label><input type="email" id="authEmail" required></div>
    <div class="field"><label for="authPass">Senha</label><input type="password" id="authPass" required minlength="6"></div>
    <p class="auth-error" id="authError"></p>
    <button type="submit" class="submit-btn" id="authSubmitBtn">Entrar</button>
  </form>
  <p class="auth-note" id="authNote"></p>
</div>
 
<!-- APP -->
<div class="wrap hidden" id="appWrap">
  <div class="masthead">
    <div>
      <p class="eyebrow">Controle financeiro pessoal</p>
      <h1>Livro-Caixa</h1>
    </div>
    <div class="header-right">
      <div class="month-nav">
        <button id="prevMonth" aria-label="Mês anterior">&#8249;</button>
        <span class="label" id="monthLabel"></span>
        <button id="nextMonth" aria-label="Próximo mês">&#8250;</button>
      </div>
      <div class="account">
        <span id="userEmail"></span>
        <button id="logoutBtn">Sair</button>
      </div>
    </div>
  </div>
 
  <div class="summary-row">
    <div class="stamp">
      <h3 id="monthStampTitle">Este mês</h3>
      <div class="stamp-figures">
        <div class="fig credit"><div class="k">Receitas</div><div class="v" id="monthCredit">R$ 0,00</div></div>
        <div class="fig debit"><div class="k">Despesas</div><div class="v" id="monthDebit">R$ 0,00</div></div>
        <div class="fig balance"><div class="k">Saldo</div><div class="v" id="monthBalance">R$ 0,00</div></div>
      </div>
    </div>
    <div class="stamp">
      <h3 id="yearStampTitle">Este ano</h3>
      <div class="stamp-figures">
        <div class="fig credit"><div class="k">Receitas</div><div class="v" id="yearCredit">R$ 0,00</div></div>
        <div class="fig debit"><div class="k">Despesas</div><div class="v" id="yearDebit">R$ 0,00</div></div>
        <div class="fig balance"><div class="k">Saldo</div><div class="v" id="yearBalance">R$ 0,00</div></div>
      </div>
    </div>
  </div>
 
  <div class="layout">
    <div class="cal-card">
      <div class="cal-weekdays"><span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span></div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
 
    <div class="side">
      <div class="panel">
        <h3>Novo lançamento</h3>
        <form id="entryForm">
          <div class="field"><label for="desc">Descrição</label><input type="text" id="desc" placeholder="Ex.: Salário, mercado, aluguel..." required maxlength="60"></div>
          <div class="field">
            <label>Tipo</label>
            <div class="toggle-type">
              <button type="button" data-type="receita" class="active">Receita</button>
              <button type="button" data-type="despesa">Despesa</button>
            </div>
          </div>
          <div class="field"><label for="valor">Valor (R$)</label><input type="text" inputmode="decimal" id="valor" placeholder="0,00" required></div>
          <div class="field"><label for="data">Dia</label><input type="date" id="data" required></div>
          <p id="formError" style="display:none;color:var(--debit);font-size:12px;margin:0 0 10px;"></p>
          <button type="submit" class="submit-btn" id="submitBtn">OK — lançar</button>
        </form>
      </div>
 
      <div class="panel">
        <h3 id="dayListTitle">Lançamentos do dia</h3>
        <div class="day-list" id="dayList"></div>
      </div>
      <div class="status" id="storageStatus"></div>
    </div>
  </div>
</div>
 
<script src="script.js"></script>
</html>
